# Publie le site sur GitHub Pages.
# - à chaque modification poussée sur main ;
# - chaque matin à 6 h (heure de Paris en hiver) après mise à jour de la revue de presse ;
# - à la demande (onglet Actions → « Site » → Run workflow).
name: Site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Revue de presse du jour
        if: github.event_name != 'push'
        run: |
          python3 scripts/veille.py
          git config user.name "revue-de-presse[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/presse.json
          git diff --cached --quiet || git commit -m "Revue de presse du $(date +%d/%m/%Y)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploiement
        uses: actions/deploy-pages@v4
